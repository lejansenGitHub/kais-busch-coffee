<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Charakterbögen</title>
    <meta name="theme-color" content="#0a0a0a" />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&display=swap" rel="stylesheet">
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { font-family: 'Cinzel', Georgia, serif; background: #0a0a0a; color: #c9aa71; min-height: 100vh; display: flex; justify-content: center; }
      .container { max-width: 480px; width: 100%; padding: 24px 16px; }
      h1 { text-align: center; font-size: 26px; color: #c9aa71; margin-bottom: 32px; letter-spacing: 3px; text-transform: uppercase; text-shadow: 0 0 8px rgba(201, 170, 113, 0.3), 0 2px 4px rgba(0, 0, 0, 0.8); }
      .links { display: flex; flex-direction: column; gap: 12px; }
      .links a { display: block; padding: 18px 20px; background: linear-gradient(135deg, rgba(30, 22, 12, 0.95), rgba(18, 14, 8, 0.98)); border: 2px solid #5a4a2a; border-radius: 2px; color: #c9aa71; text-decoration: none; font-size: 18px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; transition: border-color 0.15s; box-shadow: inset 0 1px 0 rgba(201, 170, 113, 0.15), 0 0 10px rgba(0, 0, 0, 0.6); }
      .links a:active { border-color: #8b7441; background: linear-gradient(135deg, rgba(40, 30, 16, 0.95), rgba(24, 18, 10, 0.98)); }
      .divider { border: none; border-top: 1px solid #2a2010; margin: 8px 0; }
      .links a.hero { border-color: #c9aa71; box-shadow: inset 0 1px 0 rgba(201, 170, 113, 0.25), 0 0 16px rgba(201, 170, 113, 0.15); }
      .links a.secondary { font-size: 14px; padding: 14px 20px; border-color: #3a2a1a; color: #7a6a4a; }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Charakterbögen</h1>
      <div class="links">
        <a href="story/" class="hero">Die Geschichte</a>
        <a href="lord-patten/" class="hero">Lord Patten</a>
        <hr class="divider">
        <a href="lennart/">Lennart</a>
        <a href="simon/">Simon</a>
        <a href="hubi/">Hubi</a>
        <a href="eva-enemy/">Eva</a>
        <a href="elena-enemy/">Elena</a>
        <a href="mirko/">Mirko</a>
        <a href="nick/">Nick</a>
        <a href="jess/">Jess</a>
        <a href="father/">Der Vater</a>
        <a href="daniel/">Daniel</a>
        <a href="lukas/">Lukas</a>
        <a href="kai-enemy/">Kai</a>
        <a href="katta-enemy/">Katta</a>
        <hr class="divider">
        <a href="katta/" class="secondary">Katta — Quest</a>
        <a href="father-quest/" class="secondary">Der Vater — Quest</a>
        <a href="kai/" class="secondary">Kai — Quest</a>
        <a href="hendrik/" class="secondary">Hendrik — Quest</a>
        <a href="simon-quest/" class="secondary">Simon — Quest</a>
        <a href="ingrid/" class="secondary">Ingrid — Quest</a>
        <a href="eva/" class="secondary">Eva — Quest</a>
        <a href="elena/" class="secondary">Elena — Quest</a>
        <hr class="divider">
        <a href="skills/" class="secondary">Skill-Übersicht</a>
        <a href="allies/" class="secondary">Verbündete</a>
      </div>
    </div>
  </body>
</html>
